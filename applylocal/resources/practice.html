<!doctype html><html lang="en"><meta charset="utf-8"><title>ApplyLocal practice</title>
<style>body{font:18px system-ui;max-width:720px;margin:60px auto;padding:20px;background:#f3f6f9;color:#142536}fieldset{padding:24px;background:white;border:1px solid #bec9d3;border-radius:8px}label{display:block;margin:16px 0}button{font:inherit;background:#185e99;color:white;border:0;padding:12px 24px;border-radius:6px}input{font:inherit}</style>
<h1>Practice questionnaire</h1><p>This page is served on your computer. Nothing is sent to an employer.</p><main id="content"></main>
<script>
let step=0;
const pages=[
`<fieldset><legend>Which action is safest when you notice a spill on a shop floor?</legend><label><input type="radio" name="safety" value="ignore" required>Ignore it</label><label><input type="radio" name="safety" value="secure">Secure the area and follow the spill procedure</label><label><input type="radio" name="safety" value="run">Run through it</label></fieldset>`,
`<label>Email address <input type="email" name="email" required autocomplete="email"></label>`,
`<fieldset><legend>Are you available to work weekends?</legend><label><input type="radio" name="weekends" value="yes" required>Yes</label><label><input type="radio" name="weekends" value="no">No</label></fieldset>`];
function render(){content.innerHTML=`<form>${pages[step]}<button>${step===2?'Submit':'Next'}</button></form>`;content.querySelector('form').onsubmit=e=>{e.preventDefault();if(++step===3)content.innerHTML='<h2>Thank you for completing the questionnaire.</h2>';else render()}}
render();
</script></html>
