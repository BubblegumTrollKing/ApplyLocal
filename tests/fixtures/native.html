<!doctype html><meta charset="utf-8"><title>Native layout</title>
<fieldset><legend>What should a worker do after spotting a hazard?</legend>
<label><input type="radio" name="safety" value="ignore" required>Ignore it</label>
<label><input type="radio" name="safety" value="report">Report it safely</label>
</fieldset>
<label for="email">Email address</label><input id="email" type="email" required>
<label for="state">State</label><select id="state"><option value="">Select</option><option value="fl">Florida</option><option value="ga">Georgia</option></select>
<fieldset><legend>Select the protective equipment</legend>
<label><input type="checkbox" name="ppe" value="gloves">Gloves</label>
<label><input type="checkbox" name="ppe" value="sandals">Sandals</label>
<label><input type="checkbox" name="ppe" value="goggles">Goggles</label></fieldset>
<input type="hidden" value="must not be touched"><button type="button">Next</button>
