[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "applylocal"
version = "1.1.0"
description = "Local, free questionnaire assistant for Windows"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["playwright==1.56.0", "jsonschema==4.25.1"]

[project.scripts]
applylocal = "applylocal.__main__:main"

[tool.setuptools.package-data]
applylocal = ["resources/*.js", "resources/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["browser: real Chromium integration tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
